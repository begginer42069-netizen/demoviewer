<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256"><svg x="0" y="0" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2e1670"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfc4ff"/>
    </linearGradient>
    <clipPath id="sq"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="128" cy="20" rx="170" ry="90" fill="#ffffff" opacity="0.07"/>
    <!-- take-off block, gap, landing block -->
    <rect x="0" y="182" width="74" height="80" fill="url(#blk)"/>
    <rect x="186" y="182" width="80" height="80" fill="url(#blk)"/>
    <rect x="74" y="182" width="112" height="80" fill="#1b0c4a" opacity="0.6"/>
    <rect x="0" y="182" width="74" height="6" fill="#ffffff"/>
    <rect x="186" y="182" width="80" height="6" fill="#ffffff"/>
  </g>
  <!-- the jump -->
  <path d="M60 176 C 84 64, 170 52, 204 174" fill="none" stroke="#1b0c4a" stroke-opacity="0.35" stroke-width="20" stroke-linecap="round"/>
  <path d="M60 172 C 84 60, 170 48, 204 170" fill="none" stroke="url(#arc)" stroke-width="15" stroke-linecap="round"/>
  <path d="M60 172 C 84 60, 170 48, 204 170" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 18"/>
  <!-- landing marker -->
  <circle cx="204" cy="170" r="14" fill="#ff6b3d" stroke="#fff" stroke-width="5"/>
</svg>

  <text x="292" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="100" font-weight="800" fill="#e8ebf2" letter-spacing="-2">DEM<tspan fill="#b794ff">viewer</tspan></text>
  <text x="297" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="600" fill="#97a0b2" letter-spacing="4">JUMP STATS · REPLAY · WHAT-IF</text></svg>