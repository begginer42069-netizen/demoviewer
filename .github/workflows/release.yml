name: Build and release

# Every push to main builds Windows + Linux and publishes a new release.
# The version follows semantic versioning (vMAJOR.MINOR.PATCH), bumped from
# the commit messages since the last release:
#   "feat: ..."                      -> minor  (1.2.3 -> 1.3.0)
#   "fix: ..." or anything else      -> patch  (1.2.3 -> 1.2.4)
#   "feat!: ...", "BREAKING CHANGE"  -> major  (1.2.3 -> 2.0.0)
#   "[skip release]" in a commit     -> build only, no release
# Pull requests only build. "Run workflow" lets you pick the bump by hand.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the last version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Work out the version
        id: ver
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          base=${last#v}
          [ -z "$base" ] && base=0.0.0
          IFS=. read -r major minor patch <<EOF
          $base
          EOF
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          patch=${patch%%-*}

          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          msgs=$(git log --format=%B $range)

          bump="$BUMP_INPUT"
          if [ "$bump" = auto ]; then
            if printf '%s\n' "$msgs" | grep -qE '^(BREAKING CHANGE|[a-zA-Z]+(\([^)]*\))?!:)'; then bump=major
            elif printf '%s\n' "$msgs" | grep -qE '^feat(\([^)]*\))?:'; then bump=minor
            else bump=patch; fi
          fi
          case $bump in
            major) major=$((major+1)); minor=0; patch=0;;
            minor) minor=$((minor+1)); patch=0;;
            *)     patch=$((patch+1));;
          esac
          version="$major.$minor.$patch"

          release=true
          if [ "${{ github.event_name }}" = pull_request ]; then release=false; version="$version-pr${{ github.event.number }}"; fi
          if printf '%s\n' "$msgs" | grep -qi '\[skip release\]' && [ "${{ github.event_name }}" != workflow_dispatch ]; then release=false; fi

          echo "last tag: ${last:-none}, bump: $bump -> v$version (release: $release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build Windows and Linux
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DEMviewer-${{ steps.ver.outputs.version }}
          path: |
            dist/DEMviewer.exe
            dist/DEMviewer-linux-amd64

      - name: Publish the release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" dist/DEMviewer.exe dist/DEMviewer-linux-amd64 \
            --target "$GITHUB_SHA" \
            --title "DEMviewer $TAG" \
            --generate-notes
